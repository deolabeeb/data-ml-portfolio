[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-agent"
version = "0.1.0+mlh.mock1"
description = "Mock-only SupportOps code sample with attributed starter and Codex assistance"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langsmith==0.14.2", # Used only to explicitly disable inherited tracing.
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supportops = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
